[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/libcoreutils/lcu"
rust-version = "1.80"

[package]
name = "lcu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Coreutils as callable Rust functions. No subprocess, no stdout parsing."

[dependencies]
